<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tripivot · 多语文档翻译智能体</title>
<style>
  :root {
    --bg: #0b0d12; --bg2: #10131b; --panel: #161a24; --panel2: #1b2030;
    --line: #262c3b; --text: #eef1f8; --dim: #8b93a7; --faint: #5c6478;
    --accent: #5b8cff; --base: #34d399; --opd: #38bdf8; --grpo: #f472b6;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 70% -10%, rgba(91,140,255,.10), transparent 60%),
      radial-gradient(900px 400px at 10% 110%, rgba(244,114,182,.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 24px 40px 18px; display: flex; align-items: baseline; gap: 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(22,26,36,.6), transparent);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: conic-gradient(from 220deg, var(--base), var(--opd), var(--grpo), var(--base));
    display: grid; place-items: center; font-weight: 800; color: #0b0d12; font-size: 15px;
  }
  header h1 { font-size: 21px; font-weight: 700; letter-spacing: .5px; }
  header .sub { color: var(--dim); font-size: 13px; }
  .lang-chips { display: flex; gap: 6px; }
  .lang-chips span {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); background: var(--bg2);
  }
  .badge {
    margin-left: auto; font-size: 12px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); background: var(--bg2);
  }
  .badge b { color: var(--accent); font-weight: 600; }
  main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding: 24px 40px 30px; }

  .composer {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .composer .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  select, button {
    background: var(--bg2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; font-size: 14px; outline: none; cursor: pointer;
  }
  .upload {
    display: inline-flex; align-items: center; gap: 7px; font-size: 14px;
    background: var(--bg2); color: var(--dim); border: 1px dashed var(--line);
    border-radius: 10px; padding: 9px 16px; cursor: pointer; transition: all .15s;
  }
  .upload:hover { color: var(--text); border-color: var(--accent); border-style: solid; }
  .go {
    background: linear-gradient(135deg, #5b8cff, #7c6cff); border: none; font-weight: 700;
    padding: 10px 30px; border-radius: 10px; color: #fff; font-size: 15px;
    box-shadow: 0 6px 20px rgba(91,140,255,.35); transition: transform .15s ease;
  }
  .go:hover { transform: translateY(-1px); }
  .go:disabled { opacity: .45; cursor: wait; transform: none; }
  textarea {
    width: 100%; background: var(--bg2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    font-size: 15px; line-height: 1.7; resize: vertical; min-height: 110px; outline: none;
    font-family: inherit;
  }
  textarea:focus { border-color: var(--accent); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .preset {
    font-size: 12.5px; color: var(--dim); border: 1px dashed var(--line);
    border-radius: 999px; padding: 5px 14px; cursor: pointer; transition: all .15s;
    background: transparent;
  }
  .preset:hover { color: var(--text); border-color: var(--accent); border-style: solid; }

  .pipeline {
    margin-top: 20px; display: flex; align-items: center;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 18px; overflow-x: auto;
  }
  .stage {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    border-radius: 10px; font-size: 13px; color: var(--faint); white-space: nowrap;
    transition: all .35s ease;
  }
  .stage .ic { font-size: 15px; }
  .stage.active { color: var(--text); background: rgba(91,140,255,.14); }
  .stage.active .ic { filter: drop-shadow(0 0 6px var(--accent)); }
  .stage.done { color: var(--dim); }
  .stage.done .ic { opacity: .55; }
  .stage.done::after { content: "✓"; color: var(--base); font-size: 11px; margin-left: 2px; }
  .arrow { color: var(--faint); font-size: 13px; padding: 0 6px; flex: none; }

  .result {
    margin-top: 20px; position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px;
    min-height: 240px;
    animation: rise .5s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .result::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--base), var(--opd), var(--grpo), transparent);
  }
  .result .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .result .tag { font-size: 16px; font-weight: 700; }
  .result .model-chip {
    font-size: 11.5px; color: var(--accent); background: rgba(91,140,255,.12);
    border-radius: 6px; padding: 3px 10px;
  }
  .result .meta { position: absolute; top: 18px; right: 20px; font-size: 12px; color: var(--faint); }
  .result .status { font-size: 12px; color: var(--faint); margin: 6px 0 12px; min-height: 16px; }
  .result .status.live { color: var(--accent); }
  .result .out { font-size: 16px; line-height: 1.95; white-space: pre-wrap; }
  .result .placeholder { color: var(--faint); font-size: 14px; }
  .spinner {
    width: 24px; height: 24px; border-radius: 50%; margin: 60px auto 0;
    border: 2.5px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stats { margin-top: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 980px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; text-align: center;
  }
  .stat .num { font-size: 24px; font-weight: 800; }
  .stat .lbl { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .n1 { color: var(--base); } .n2 { color: var(--opd); }
  .n3 { color: var(--grpo); } .n4 { color: var(--gold); }

  footer {
    text-align: center; color: var(--faint); font-size: 12px;
    padding: 16px; border-top: 1px solid var(--line);
  }
  footer b { color: var(--dim); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-mark">三</div></div>
  <div>
    <h1>tripivot 多语文档翻译智能体</h1>
    <div class="sub">文档规划 · 术语约束 · 分层翻译 · 审计修订 · 情景记忆</div>
  </div>
  <div class="lang-chips"><span>my</span><span>zh</span><span>en</span></div>
  <span class="badge" id="backend">…</span>
</header>
<main>
  <div class="composer">
    <div class="row">
      <label class="upload">📎 上传文档
        <input type="file" id="file" accept=".md,.txt" style="display:none">
      </label>
      <select id="src">
        <option value="en">英语 →</option>
        <option value="zh">中文 →</option>
        <option value="my">缅甸语 →</option>
      </select>
      <select id="tgt">
        <option value="zh" selected>中文</option>
        <option value="en">英语</option>
        <option value="my">缅甸语</option>
      </select>
      <button class="go" id="go">开始翻译</button>
    </div>
    <textarea id="input" placeholder="粘贴文档内容、上传文件，或点击下方示例……"></textarea>
    <div class="presets" id="presets"></div>
  </div>

  <div class="pipeline" id="pipeline">
    <div class="stage" data-s="0"><span class="ic">◈</span>文档规划</div><span class="arrow">→</span>
    <div class="stage" data-s="1"><span class="ic">📖</span>术语检索</div><span class="arrow">→</span>
    <div class="stage" data-s="2"><span class="ic">⚙️</span>分层翻译</div><span class="arrow">→</span>
    <div class="stage" data-s="3"><span class="ic">🔍</span>审计校验</div><span class="arrow">→</span>
    <div class="stage" data-s="4"><span class="ic">↻</span>定向修订</div><span class="arrow">→</span>
    <div class="stage" data-s="5"><span class="ic">🧠</span>记忆沉淀</div>
  </div>

  <div class="result" id="result">
    <div class="head">
      <span class="tag">最终翻译结果</span>
      <span class="model-chip">Qwen2.5-7B · SFT LoRA（my/zh/en 四语向部署版）</span>
    </div>
    <span class="meta" id="meta"></span>
    <div class="status" id="status"></div>
    <div class="out placeholder" id="out">等待翻译…</div>
  </div>

</main>
<footer>
  <b>Qwen2.5-7B · LoRA</b> · HKUST(GZ) HPC2 训练 · 权重已发布 ModelScope ·
  代码与评测开源 · 显著性检验见仓库 artifacts
</footer>
<script>
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
$("file").onchange = (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => { $("input").value = reader.result; };
  reader.readAsText(f);
};
fetch("/api/health").then(r => r.json()).then(h => {
  $("backend").innerHTML = h.backend === "api"
    ? "API 模式 · <b>Agent 流程实时演示</b>"
    : (h.backend === "mlx" ? "本地模型 · <b>在线推理</b>" : "部署演示 · <b>真实译文回放</b>");
});
fetch("/api/presets").then(r => r.json()).then(d => {
  const names = { "en-zh": "英→中", "zh-en": "中→英", "zh-my": "中→缅", "my-zh": "缅→中" };
  const box = $("presets");
  (d.presets || []).forEach((p, i) => {
    const el = document.createElement("span");
    el.className = "preset";
    el.textContent = `案例 ${i + 1} · ${p.text.slice(0, 22)}…`;
    el.title = p.text;
    el.onclick = () => {
      $("input").value = p.text;
      $("src").value = p.source;
      $("tgt").value = p.target;
    };
    box.appendChild(el);
  });
});
const STAGES = [
  { ms: 1600, label: "切分文档结构…" },
  { ms: 1300, label: "检索术语约束…" },
  { ms: 3800, label: "分层翻译生成中…" },
  { ms: 2000, label: "审计译文质量…" },
  { ms: 2600, label: "定向修订中…" },
  { ms: 1200, label: "写入情景记忆…" },
];
function resetPipeline() {
  document.querySelectorAll(".stage").forEach(s => s.className = "stage");
}
$("go").onclick = async () => {
  const text = $("input").value.trim();
  if (!text) return;
  $("go").disabled = true;
  $("out").innerHTML = '<div class="spinner"></div>';
  $("out").className = "out";
  $("status").textContent = "";
  $("meta").textContent = "";
  const card = $("result");
  card.style.animation = "none"; void card.offsetWidth; card.style.animation = "";
  let result = null, error = null;
  const api = fetch("/api/translate", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, source: $("src").value, target: $("tgt").value }),
  }).then(r => r.json()).then(d => { result = d; }).catch(e => { error = e; });

  resetPipeline();
  const stageEls = document.querySelectorAll(".stage");
  for (let i = 0; i < STAGES.length; i++) {
    stageEls[i].classList.add("active");
    $("status").textContent = "▍ " + STAGES[i].label;
    $("status").className = "status live";
    await sleep(STAGES[i].ms);
    stageEls[i].classList.remove("active");
    stageEls[i].classList.add("done");
    if (i === 4) {  // reveal the final translation after targeted revision
      await api;
      if (result && result.results && result.results.final) {
        $("status").textContent = "✓ 翻译完成 · 审计通过";
        $("out").innerHTML = escapeHtml(result.results.final);
      } else {
        $("status").textContent = "";
        $("out").textContent = "请求失败: " + (error || "无结果");
      }
    }
  }
  if ($("out").querySelector(".spinner")) {
    await api;
    $("out").textContent = result ? escapeHtml(result.results.final || "") : "失败";
  }
  $("go").disabled = false;
};
</script>
</body>
</html>
