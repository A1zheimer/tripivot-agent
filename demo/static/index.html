<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tripivot · 多语文档翻译智能体</title>
<style>
  :root {
    --bg: #0b0d12; --bg2: #10131b; --panel: #161a24; --panel2: #1b2030;
    --line: #262c3b; --text: #eef1f8; --dim: #8b93a7; --faint: #5c6478;
    --accent: #5b8cff; --base: #34d399; --opd: #38bdf8; --grpo: #f472b6;
    --gold: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 500px at 70% -10%, rgba(91,140,255,.10), transparent 60%),
      radial-gradient(900px 400px at 10% 110%, rgba(244,114,182,.06), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 26px 40px 20px; display: flex; align-items: baseline; gap: 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(22,26,36,.6), transparent);
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: conic-gradient(from 220deg, var(--base), var(--opd), var(--grpo), var(--base));
    display: grid; place-items: center; font-weight: 800; color: #0b0d12; font-size: 15px;
  }
  header h1 { font-size: 21px; font-weight: 700; letter-spacing: .5px; }
  header .sub { color: var(--dim); font-size: 13px; }
  .lang-chips { display: flex; gap: 6px; }
  .lang-chips span {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); background: var(--bg2);
  }
  .badge {
    margin-left: auto; font-size: 12px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--dim); background: var(--bg2);
  }
  .badge b { color: var(--accent); font-weight: 600; }
  main { flex: 1; width: 100%; max-width: 1360px; margin: 0 auto; padding: 26px 40px 30px; }

  .composer {
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .composer .row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  select, button {
    background: var(--bg2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; font-size: 14px; outline: none; cursor: pointer;
  }
  select:focus, button:focus { border-color: var(--accent); }
  .go {
    background: linear-gradient(135deg, #5b8cff, #7c6cff); border: none; font-weight: 700;
    padding: 10px 26px; border-radius: 10px; color: #fff; font-size: 15px;
    box-shadow: 0 6px 20px rgba(91,140,255,.35); transition: transform .15s ease, opacity .15s;
  }
  .go:hover { transform: translateY(-1px); }
  .go:disabled { opacity: .45; cursor: wait; transform: none; }
  textarea {
    width: 100%; background: var(--bg2); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    font-size: 15px; line-height: 1.65; resize: vertical; min-height: 96px; outline: none;
    font-family: inherit;
  }
  textarea:focus { border-color: var(--accent); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .preset {
    font-size: 12.5px; color: var(--dim); border: 1px dashed var(--line);
    border-radius: 999px; padding: 5px 14px; cursor: pointer; transition: all .15s;
    background: transparent;
  }
  .preset:hover { color: var(--text); border-color: var(--accent); border-style: solid; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 22px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .card {
    position: relative; overflow: hidden;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px;
    min-height: 220px; display: flex; flex-direction: column;
    animation: rise .45s cubic-bezier(.2,.7,.3,1) both;
  }
  .card:nth-child(2) { animation-delay: .08s; } .card:nth-child(3) { animation-delay: .16s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .card.base::before { background: linear-gradient(90deg, var(--base), transparent); }
  .card.opd::before  { background: linear-gradient(90deg, var(--opd), transparent); }
  .card.grpo::before { background: linear-gradient(90deg, var(--grpo), transparent); }
  .card .head { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .card .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .card.base .dot { background: var(--base); box-shadow: 0 0 12px var(--base); }
  .card.opd  .dot { background: var(--opd);  box-shadow: 0 0 12px var(--opd); }
  .card.grpo .dot { background: var(--grpo); box-shadow: 0 0 12px var(--grpo); }
  .card .tag { font-size: 14.5px; font-weight: 700; letter-spacing: .3px; }
  .card .meta { position: absolute; top: 16px; right: 16px; font-size: 12px; color: var(--faint); }
  .chips { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; padding: 3px 9px; border-radius: 6px;
    background: rgba(139,147,167,.12); color: var(--dim); border: 1px solid transparent;
  }
  .card.base .chip.win { color: var(--base); background: rgba(52,211,153,.1); }
  .card.opd  .chip.win { color: var(--opd);  background: rgba(56,189,248,.1); }
  .card.grpo .chip.win { color: var(--grpo); background: rgba(244,114,182,.1); }
  .card .out { font-size: 14.5px; line-height: 1.85; white-space: pre-wrap; flex: 1; }
  .card .placeholder { color: var(--faint); font-size: 14px; }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%; margin: 40px auto 0;
    border: 2.5px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stats {
    margin-top: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  @media (max-width: 980px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--bg2); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; text-align: center;
  }
  .stat .num { font-size: 24px; font-weight: 800; letter-spacing: .5px; }
  .stat .lbl { font-size: 12px; color: var(--dim); margin-top: 3px; }
  .n1 { color: var(--base); } .n2 { color: var(--opd); }
  .n3 { color: var(--grpo); } .n4 { color: var(--gold); }

  footer {
    text-align: center; color: var(--faint); font-size: 12px;
    padding: 16px; border-top: 1px solid var(--line);
  }
  footer b { color: var(--dim); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-mark">三</div></div>
  <div>
    <h1>tripivot 多语文档翻译智能体</h1>
    <div class="sub">数据管线 · SFT 微调 · 后训练对比 · 轨迹级 RL</div>
  </div>
  <div class="lang-chips"><span>my</span><span>zh</span><span>en</span></div>
  <span class="badge" id="backend">…</span>
</header>
<main>
  <div class="composer">
    <div class="row">
      <select id="src">
        <option value="en">英语 →</option>
        <option value="zh">中文 →</option>
        <option value="my">缅甸语 →</option>
      </select>
      <select id="tgt">
        <option value="zh" selected>中文</option>
        <option value="en">英语</option>
        <option value="my">缅甸语</option>
      </select>
      <button class="go" id="go">翻译对比</button>
    </div>
    <textarea id="input" placeholder="输入文本，或点击下方示例……"></textarea>
    <div class="presets" id="presets"></div>
  </div>

  <div class="grid" id="grid">
    <div class="card base" id="card-baseline">
      <div class="head"><span class="dot"></span><span class="tag" id="tag-baseline">SFT 基线</span></div>
      <span class="meta" id="meta-baseline"></span>
      <div class="chips" id="chips-baseline"></div>
      <div class="out placeholder" id="out-baseline">等待翻译…</div>
    </div>
    <div class="card opd" id="card-opd">
      <div class="head"><span class="dot"></span><span class="tag" id="tag-opd">OPD（教师蒸馏）</span></div>
      <span class="meta" id="meta-opd"></span>
      <div class="chips" id="chips-opd"></div>
      <div class="out placeholder" id="out-opd">等待翻译…</div>
    </div>
    <div class="card grpo" id="card-grpo">
      <div class="head"><span class="dot"></span><span class="tag" id="tag-grpo">GRPO（指标奖励 RL）</span></div>
      <span class="meta" id="meta-grpo"></span>
      <div class="chips" id="chips-grpo"></div>
      <div class="out placeholder" id="out-grpo">等待翻译…</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num n1">+42%</div><div class="lbl">缅向 COMET（SFT vs 原版）</div></div>
    <div class="stat"><div class="num n2">0%</div><div class="lbl">OPD 退化率（基线 3.6%）</div></div>
    <div class="stat"><div class="num n3">+27%</div><div class="lbl">GRPO BLEU（en-zh，修正分词前）</div></div>
    <div class="stat"><div class="num n4">×10</div><div class="lbl">Agent 审计一次通过率（SFT 训练）</div></div>
  </div>
</main>
<footer>
  <b>Qwen2.5-7B · LoRA</b> · HKUST(GZ) HPC2 训练 · 权重已发布 ModelScope ·
  代码与评测开源 · 显著性检验见仓库 artifacts
</footer>
<script>
const $ = (id) => document.getElementById(id);
const WIN_CHIPS = {
  baseline: [["术语软约束", 0], ["全语向", 0]],
  opd: [["退化率 0%", 1], ["COMET 最高", 1]],
  grpo: [["chrF++ 最高", 1], ["忠实完整", 1]],
};
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderChips() {
  for (const [v, chips] of Object.entries(WIN_CHIPS)) {
    $("chips-" + v).innerHTML = chips.map(([t, win]) =>
      `<span class="chip${win ? " win" : ""}">${t}</span>`).join("");
  }
}
renderChips();
fetch("/api/health").then(r => r.json()).then(h => {
  $("backend").innerHTML = h.backend === "api"
    ? "API 模式 · <b>Agent 流程实时演示</b>"
    : (h.backend === "mlx" ? "本地模型 · <b>在线推理</b>" : "缓存模式 · <b>预计算真实译文</b>");
  (h.labels || []).forEach((label, i) => {
    const el = $("tag-" + ["baseline", "opd", "grpo"][i]);
    if (el) el.textContent = label;
  });
});
fetch("/api/presets").then(r => r.json()).then(d => {
  const box = $("presets");
  (d.presets || []).slice(0, 4).forEach((p, i) => {
    const el = document.createElement("span");
    el.className = "preset";
    el.textContent = `示例 ${i + 1} · ${p.text.slice(0, 26)}…`;
    el.title = p.text;
    el.onclick = () => { $("input").value = p.text; };
    box.appendChild(el);
  });
});
$("go").onclick = async () => {
  const text = $("input").value.trim();
  if (!text) return;
  $("go").disabled = true;
  for (const v of ["baseline", "opd", "grpo"]) {
    $("out-" + v).innerHTML = '<div class="spinner"></div>';
    $("out-" + v).className = "out";
    $("meta-" + v).textContent = "";
  }
  // retrigger card entrance animation
  for (const c of document.querySelectorAll(".card")) {
    c.style.animation = "none"; void c.offsetWidth; c.style.animation = "";
  }
  try {
    const res = await fetch("/api/translate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, source: $("src").value, target: $("tgt").value }),
    });
    const data = await res.json();
    for (const [v, out] of Object.entries(data.results)) {
      $("out-" + v).innerHTML = escapeHtml(out);
      $("meta-" + v).textContent = data.latencies[v] + "s";
    }
  } catch (e) {
    for (const v of ["baseline", "opd", "grpo"])
      $("out-" + v).textContent = "请求失败: " + e;
  } finally { $("go").disabled = false; }
};
</script>
</body>
</html>
